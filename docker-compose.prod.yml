version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: avom_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avom_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_avom_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-avom_production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avom_admin} -d ${POSTGRES_DB:-avom_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: avom_prod_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: avom_prod_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: avom_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-avom_admin}:${POSTGRES_PASSWORD:-secure_avom_password_2026}@postgres:5432/${POSTGRES_DB:-avom_production}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod_super_secret_jwt_key_987654321}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: avom_prod_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_prod_data:
  qdrant_prod_data:
  redis_prod_data:
