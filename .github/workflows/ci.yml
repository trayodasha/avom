name: AVOM Continuous Integration & Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Type Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: avom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd apps/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx coverage

      - name: Run Backend Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          QDRANT_LOCATION: ":memory:"
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test_ci_jwt_secret_key_123456789
        run: |
          cd apps/backend
          pytest -v --durations=10

  frontend-build:
    name: Frontend TypeScript Validation & Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/frontend/package.json

      - name: Install Dependencies
        run: |
          cd apps/frontend
          npm ci || npm install

      - name: Run Type Check & Build Bundle
        run: |
          cd apps/frontend
          npm run build

  docker-build-verification:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: false
          tags: avom-backend:ci-test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: false
          tags: avom-frontend:ci-test
